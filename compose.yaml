services:
  app:
    hostname: auth-service
    container_name: auth-service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      - ENV=development
    ports:
      - "5001:8080"
    volumes:
      - .:/app
      - /app/tmp
    networks:
      - default
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default

volumes:
  postgres_data:

networks:
  default: